
name: Security - SCA

on:
  push:
    branches:
      - dev
  pull_request:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./javascript   # <-- only JS app folder
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-results.json
          exit-code: "1"

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.json
          if-no-files-found: ignore
          retention-days: 30

  osv-scan:
    name: OSV Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install OSV-Scanner
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run OSV-Scanner
        run: |
          osv-scanner scan source \
            -r ./javascript \   # <-- only JS app folder
            --format json \
            --output-file osv-results.json

      - name: Upload OSV Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-report
          path: ./javascript/osv-results.json
          if-no-files-found: ignore
          retention-days: 30
